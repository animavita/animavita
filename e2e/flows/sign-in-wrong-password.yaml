appId: com.ggbelgamo.animavita
name: Signing in with a wrong password shows an error and stays on the sign-in screen
---
- runFlow: ../subflows/launch-signed-out.yaml
- runFlow:
    file: ../subflows/submit-sign-in.yaml
    env:
      EMAIL: adopter@email.com
      PASSWORD: WrongPassword1
- assertVisible: "(.* )?Wrong email or password( .*)?"
- assertVisible:
    id: signin-form-email-input
