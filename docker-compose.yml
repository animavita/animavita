version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_started
    ports:
      - 3000:3000
    environment:
      - MONGODB_URI=mongodb://mongo:mongo@animavita_mongo/?authMechanism=DEFAULT&replicaSet=rs0
      - JWT_ACCESS_SECRET=123
      - JWT_ACCESS_TOKEN_EXPIRATION=24h
      - JWT_REFRESH_SECRET=321
      - JWT_REFRESH_TOKEN_EXPIRATION=14d
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_S3_BUCKET_NAME=animavita-uploads
      - AWS_ENDPOINT=http://localstack:4566
      # pnpm 12 would otherwise try an install before the script and fail: /app is the bind-mounted backend, not a workspace.
      - pnpm_config_verify_deps_before_run=false
    command: pnpm run start:dev

  mongodb:
    container_name: animavita_mongo
    image: mongo:7.0.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=mongo
      - MONGO_INITDB_DATABASE=animavita
    # Single-node replica set: MongoDB only supports transactions on a replica set.
    # A replica set with auth needs a keyfile, so we generate one on start.
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /data/keyfile
        chmod 400 /data/keyfile
        chown mongodb:mongodb /data/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile --bind_ip_all
    # Initiates the replica set on first run, then reports healthy once it is primary.
    # The backend waits for this, so it never starts against a half-ready database.
    healthcheck:
      test:
        - CMD
        - mongosh
        - -u
        - mongo
        - -p
        - mongo
        - --quiet
        - --eval
        - |
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'animavita_mongo:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - mongo:/data/db

  localstack:
    container_name: animavita_localstack
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./apps/backend/scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh

volumes:
  mongo:
  localstack-data:
