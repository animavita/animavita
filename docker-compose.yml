version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    image: animavita_backend:latest # No Swarm, o ideal é explicitar a tag da imagem
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # ATENÇÃO: No Swarm, volumes de bind-mount locais (./apps/backend) só funcionam 
      # perfeitamente se a aplicação estiver rodando na mesma máquina (single-node).
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - localstack
    deploy:
      mode: replicated
      replicas: 1 # Quantas instâncias do backend você quer rodar
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    command: pnpm run start:dev

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: animavita
    volumes:
      - mongo_data:/data/db # Nome ajustado para o volume global
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager] # Mantém o banco rodando no nó principal por segurança de volume
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "mongodb://mongo:mongo@localhost:27017/admin?authSource=admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  localstack:
    image: localstack/localstack:3.0
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: 1
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./apps/backend/scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh
    deploy:
      mode: replicated
      replicas: 1

volumes:
  mongo_data:
    driver: local
  localstack_data:
    driver: local
