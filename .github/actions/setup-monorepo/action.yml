name: Setup Monorepo
description: Prepare and install everything for the monorepo

inputs:
  eas-version:
    description: Version of EAS CLI to use
    default: latest

  expo-version:
    description: Version of Expo CLI to use
    default: latest

  expo-token:
    description: Expo token to authenticate with
    required: false

runs:
  using: composite
  steps:
    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

    - name: 🏗 Setup Node
      uses: actions/setup-node@v3
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: 🏗 Setup EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}

    - name: 📦 Install dependencies
      run: pnpm install
      shell: bash

    - name: Build shared dependencies
      run: pnpm --filter "./shared/**" run build
      shell: bash
