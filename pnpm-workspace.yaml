packages:
  - apps/*
  - shared/*
  - e2e

autoInstallPeers: true
nodeLinker: hoisted
strictPeerDependencies: false

patchedDependencies:
  native-base@3.4.25: patches/native-base@3.4.25.patch

overrides:
  '@aws-sdk/client-s3': ^3.966.0

allowBuilds:
  argon2: true
  mongodb-memory-server: true
  # Build scripts that were already skipped under pnpm 10; pnpm 11 errors unless each is listed.
  '@nestjs/core': false
  '@parcel/watcher': false
  msw: false
  nx: false
  styled-components: false
